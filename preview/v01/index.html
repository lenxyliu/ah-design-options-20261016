<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102A50">
  <meta name="description" content="腾讯云 Agent Hosting 产品家族：Lighthouse Agent、ClawPro、SkillHub 与 Octop。空间交互设计预览。">
  <title>Agent Hosting — 腾讯云智能体托管 · 设计预览</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-view="overview">
  <a class="skip-link" href="#product-navigation">选择产品</a>
  <div class="world" id="world">
    <canvas id="scene" aria-label="Agent Hosting 四产品空间。也可使用下方产品导航进行选择。"></canvas>
    <div class="scene-fallback" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="world-atmosphere" aria-hidden="true"></div>
    <div id="scene-labels" class="scene-labels" aria-hidden="true"></div>
  </div>

  <header class="site-header">
    <button class="brand" id="brand-home" aria-label="Agent Hosting，返回产品家族总览"><span class="tencent">腾讯云</span><span class="brand-divider"></span><span class="brand-product">Agent Hosting</span></button>
    <nav class="global-nav" aria-label="主导航">
      <button class="nav-link is-active" data-route="overview">产品家族</button>
      <button class="nav-link" data-route="applications">应用场景</button>
      <button class="nav-link" data-route="resources">资源</button>
    </nav>
    <button class="header-explore" id="header-explore">探索产品<span aria-hidden="true">↗</span></button>
  </header>

  <main id="main">
    <section class="overview" aria-labelledby="hero-title">
      <div class="hero-identity"><p class="eyebrow">TENCENT CLOUD / AGENT HOSTING</p><h1 id="hero-title">Agent <span>Hosting</span><span class="title-point" aria-hidden="true"></span></h1><p class="hero-category">腾讯云智能体托管</p></div>
      <div class="overview-context"><p>从云端运行到企业管控，<br>找到适合你的 Agent 产品。</p><button class="text-link" id="family-guide">如何选择 <span aria-hidden="true">↗</span></button></div>
      <div class="overview-note"><span class="live-line" aria-hidden="true"></span><span>选择一个产品，进入它的空间</span></div>
    </section>

    <section class="focus-copy" id="focus-copy" aria-live="polite" aria-atomic="true" aria-label="当前产品" hidden>
      <p class="breadcrumb"><button data-route="overview">Agent Hosting</button><span aria-hidden="true">/</span><span id="focus-breadcrumb"></span></p>
      <p class="focus-category" id="focus-category"></p>
      <h2 id="focus-title"></h2>
      <p class="focus-intro" id="focus-intro"></p>
      <div class="focus-features" id="focus-features"></div>
      <div class="focus-actions"><button class="primary-button" id="open-detail">深入了解 <span aria-hidden="true">↗</span></button><button class="text-link quiet" data-route="overview">回到总览</button></div>
    </section>
  </main>

  <footer class="product-footer">
    <div class="family-sign"><span class="family-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>AGENT HOSTING<br><b>PRODUCT FAMILY</b></span></div>
    <nav class="product-navigation" id="product-navigation" aria-label="产品家族"></nav>
    <button class="motion-control" id="motion-control" aria-pressed="false" aria-label="减少动态效果"><span aria-hidden="true">◌</span><span>动态</span></button>
  </footer>
  <p class="screen-reader-status sr-only" id="status" role="status"></p>

  <dialog class="content-dialog" id="content-dialog" aria-labelledby="dialog-title">
    <button class="dialog-outside" aria-label="关闭内容，返回产品空间"></button>
    <div class="dialog-surface">
      <header class="dialog-header"><button class="dialog-home text-link" data-close-dialog>← 返回空间</button><span class="dialog-breadcrumb">AGENT HOSTING</span><button class="close-button" data-close-dialog aria-label="关闭">×</button></header>
      <div id="dialog-content" class="dialog-content"></div>
    </div>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
